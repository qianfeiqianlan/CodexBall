name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Prepare Live2D assets and license notices
        shell: pwsh
        run: ./scripts/Setup-Live2D.ps1

      - name: Download and import bundled Live2D models
        shell: pwsh
        run: |
          ./scripts/Download-Live2DModels.ps1
          ./scripts/Import-Live2DModels.ps1 -SourceDirectory ./artifacts/model-downloads
          ./scripts/Test-Live2DModels.ps1
          git diff --exit-code -- CodexBall.App/Skins

      - name: Test with bundled models
        run: dotnet test --configuration Release --no-restore --filter "Category!=Live2DGraphics"

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Publish Windows app
        run: >
          dotnet publish .\CodexBall.App\CodexBall.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.get_version.outputs.VERSION }}
          --output .\artifacts\CodexBall

      - name: Package release asset
        shell: pwsh
        run: |
          ./scripts/Test-Live2DModels.ps1 -SkinsDirectory ./artifacts/CodexBall/Skins
          $version = "${{ steps.get_version.outputs.VERSION }}"
          Compress-Archive -Path .\artifacts\CodexBall\* -DestinationPath ".\artifacts\CodexBall-$version-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/CodexBall-${{ steps.get_version.outputs.VERSION }}-win-x64.zip
          name: v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-release:
    name: Desktop ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: build-and-release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Prepare shared runtime and models
        shell: pwsh
        run: |
          ./scripts/Setup-Desktop.ps1
          ./scripts/Download-Live2DModels.ps1
          ./scripts/Import-Live2DModels.ps1 -SourceDirectory ./artifacts/model-downloads
          ./scripts/Test-Live2DModels.ps1
      - run: dotnet test solutions/CodexBall.Desktop.sln -c Release
      - name: Publish self-contained desktop bundle
        shell: pwsh
        run: ./scripts/Publish-Desktop.ps1 -Runtime '${{ matrix.rid }}' -Version ('${{ github.ref_name }}'.TrimStart('v'))
      - name: Attach desktop asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/desktop/CodexBall-Desktop-*-${{ matrix.rid }}.zip

name: Build and test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Prepare official Live2D preview assets
        shell: pwsh
        run: ./scripts/Setup-Live2D.ps1

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (graphics integration requires a local OpenGL 3.3 GPU)
        run: dotnet test --configuration Release --no-build --filter "Category!=Live2DGraphics"

<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">CodexBall — Codex usage at a glance</title>
  <desc id="description">A lightweight Windows widget with a dual ring and Live2D companions. Example remaining quota: short window 72 percent, long window 50 percent.</desc>
  <rect width="960" height="540" fill="#101418"/>
  <rect width="960" height="540" fill="url(#grid)" opacity="0.22"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="72" y="205" fill="#F4F7FA" font-size="48" font-weight="700" letter-spacing="-1.5">CodexBall</text>
    <text x="74" y="248" fill="#DCE4EC" font-size="21">Codex usage at a glance.</text>
    <text x="74" y="289" fill="#A9B4C0" font-size="16">A tiny Windows widget.</text>
    <text x="74" y="315" fill="#A9B4C0" font-size="16">A floating ring or a Live2D companion.</text>
    <circle cx="520" cy="252" r="49" fill="#161A20"/>
    <circle cx="520" cy="252" r="43" stroke="#303A45" stroke-width="6"/>
    <circle cx="520" cy="252" r="43" stroke="#39D98A" stroke-width="6" stroke-linecap="round" stroke-dasharray="194.53 270.18" transform="rotate(-90 520 252)"/>
    <circle cx="520" cy="252" r="33" stroke="#28333E" stroke-width="3"/>
    <circle cx="520" cy="252" r="33" stroke="#8DBBD4" stroke-width="3" stroke-linecap="round" stroke-dasharray="103.67 207.35" transform="rotate(-90 520 252)"/>
    <text x="520" y="262" fill="#FFFFFF" font-size="28" font-weight="600" text-anchor="middle">72</text>
    <rect x="604" y="153" width="284" height="206" rx="14" fill="#191F26" stroke="#2B3440"/>
    <text x="628" y="190" fill="#F4F7FA" font-size="18" font-weight="600">Codex remaining quota</text>
    <text x="628" y="231" fill="#A9B4C0" font-size="13">Short window</text>
    <text x="864" y="231" fill="#DCE4EC" font-size="13" font-weight="600" text-anchor="end">72%</text>
    <rect x="628" y="245" width="236" height="6" rx="3" fill="#303A45"/>
    <rect x="628" y="245" width="169.92" height="6" rx="3" fill="#39D98A"/>
    <text x="628" y="294" fill="#A9B4C0" font-size="13">Long window</text>
    <text x="864" y="294" fill="#DCE4EC" font-size="13" font-weight="600" text-anchor="end">50%</text>
    <rect x="628" y="308" width="236" height="6" rx="3" fill="#303A45"/>
    <rect x="628" y="308" width="118" height="6" rx="3" fill="#F5BB40"/>
    <text x="74" y="433" fill="#8F9BA8" font-size="13">Local-only. No API keys. No browser cookies.</text>
    <rect x="772" y="408" width="116" height="36" rx="18" fill="#161A20" stroke="#303A45"/>
    <circle cx="796" cy="426" r="12" fill="#202832" stroke="#39D98A" stroke-width="3"/>
    <text x="796" y="430" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">72</text>
    <text x="816" y="431" fill="#DCE4EC" font-size="13">Tray icon</text>
  </g>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#2B3440" stroke-width="1"/>
    </pattern>
  </defs>
</svg>
